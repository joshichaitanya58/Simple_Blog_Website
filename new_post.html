<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create New Post — SimpleBlog</title>
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/270d.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Sticky Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">✍️</span>
        <span>Simple<span class="brand-accent">Blog</span></span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-ghost">← Back to Feed</a>
      </div>
    </div>
  </header>

  <!-- Editor Section -->
  <main class="container editor-wrapper">
    <div class="editor-card">
      <div class="editor-header">
        <div>
          <h1>Publish a New Article</h1>
          <p>Fill out the details below to share your post on the blog feed.</p>
        </div>
        <div class="word-counter" id="wordCounter">0 words • 1 min read</div>
      </div>

      <form id="postForm">
        <div class="form-group">
          <label for="title">Article Title <span class="req">*</span></label>
          <input type="text" id="title" placeholder="e.g., How I Built My First Python SDK" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author">Author Name</label>
            <input type="text" id="author" placeholder="e.g., Guest Writer (Optional)" />
          </div>
          <div class="form-group">
            <label for="category">Topic / Category</label>
            <select id="category">
              <option value="Technology">Technology</option>
              <option value="Coding">Coding</option>
              <option value="Career">Career</option>
              <option value="Lifestyle">Lifestyle</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="content">Article Content <span class="req">*</span></label>
          <textarea id="content" rows="12" placeholder="Write your thoughts, tutorials, or stories here..." required></textarea>
        </div>

        <div class="editor-actions">
          <a href="index.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary btn-lg">🚀 Publish Article</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 SimpleBlog • Distraction-Free Writing</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
